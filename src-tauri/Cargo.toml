[package]
name = "fairstack-coreview"
version = "0.1.0"
description = "Fairstack Coreview — cross-platform system information and monitoring"
authors = ["Fairstack"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sysinfo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
window-vibrancy = "0.8.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "1.0.1"
tauri-plugin-global-shortcut = "2.3.2"
axum = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14.10"
sha2 = "0.11.0"
rand = "0.10.3"
hex = "0.4.3"
async-trait = "0.1.92"
local-ip-address = "0.6.13"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
libc = "0.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Performance", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
